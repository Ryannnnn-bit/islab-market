<style>

body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font-ui); margin: 0; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));

<div class="wrap">
  <header class="top">
    <h1>台股盤中全景</h1>
    <span class="stamp" id="stamp"></span>
  </header>
  <section class="panel" aria-label="大盤指數"><div class="idx" id="idx"></div></section>
  <section class="panel" aria-label="產業全景">
    <div class="panel-head"><h2 class="muted" style="font-size:13px">產業全景</h2>
      <div class="seg" role="group" aria-label="面積"><button type="button" id="map-v" aria-pressed="true">面積：成交值</button><button type="button" id="map-m" aria-pressed="false">面積：市值</button></div></div>
    <div class="panel-head"><span class="note" id="map-note"></span><span class="map-scale" id="map-scale"></span></div>
    <div class="map-wrap"><div class="map" id="map" role="img" aria-label="產業與個股漲跌方塊圖"></div><aside class="map-side" id="map-side"></aside>
      <div class="map-tip" id="map-tip" hidden></div></div>
    <p class="note">先分產業、再分個股；格子越大代表成交值（或市值）越大，紅漲綠跌，顏色越深漲跌越大；點一下格子看細節。對大盤貢獻點數由發行股數估算。資料來自永豐 API 快照，每 5 分鐘更新、頁面每 2 分鐘重新整理，可能有幾分鐘延遲。只呈現公開行情，不是買賣建議。</p>
  </section>
</div>
<script>// 產業全景 (two-level treemap) shared by the trading terminal and the intraday page.
// renderMarketMap(M, el): M = islab.live.market_map.build_map() payload (+ day / note fields),
// el = { box, side, note, scale, tip, byValue, byCap, hashView? } DOM elements.
function renderMarketMap(M, el) {
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const box = el.box;
  if (!M) {
    box.style.height = "auto";
    box.innerHTML = '<p class="empty" style="padding: 8px">需要全市場行情與產業分類，排程執行後出現。</p>';
    return;
  }
  let useM = false;
  // amounts arrive in millions of TWD: 億 = 100 million, 兆 = 1,000,000 million
  const yi = (mil) => mil >= 1e6 ? `${(mil / 1e6).toFixed(mil >= 1e7 ? 0 : 1)} 兆` : `${(mil / 100).toFixed(mil >= 1e3 ? 0 : 1)} 億`;
  const pc = (p) => `${p > 0 ? "+" : ""}${p.toFixed(2)}%`;
  const pt = (c) => c == null ? "–" : `${c > 0 ? "+" : ""}${c.toFixed(1)}`;
  const col = (p) => {
    if (Math.abs(p) < 0.05) return "var(--faint)";
    const t = Math.min(Math.abs(p) / 7, 1);
    return `color-mix(in srgb, var(${p > 0 ? "--up" : "--down"}) ${Math.round(18 + 72 * t)}%, var(--panel))`;
  };
  const ink = (p) => Math.min(Math.abs(p) / 7, 1) > 0.45 ? "#fff" : "var(--fg)";
  el.scale.innerHTML = [-7, -3, -1, 0, 1, 3, 7].map((p) => `<i style="background: ${col(p)}" title="${p}%"></i>`).join("") +
    '<span>−7%　　＋7%</span>';
  // squarified treemap (Bruls et al.): rows of items laid along the shorter side, keeping cells near-square
  function squarify(items, x, y, w, h) {
    const out = [], total = items.reduce((a, b) => a + b.a, 0);
    if (!total || w <= 0 || h <= 0) return out;
    const scale = (w * h) / total;
    let rest = items.map((it) => ({ it, a: it.a * scale })).filter((r) => r.a > 0);
    const worst = (row, side) => {
      const s = row.reduce((a, b) => a + b.a, 0), mx = Math.max(...row.map((r) => r.a)), mn = Math.min(...row.map((r) => r.a));
      return Math.max((side * side * mx) / (s * s), (s * s) / (side * side * mn));
    };
    while (rest.length) {
      const side = Math.min(w, h);
      let row = [rest[0]], k = 1;
      while (k < rest.length && worst([...row, rest[k]], side) <= worst(row, side)) { row.push(rest[k]); k++; }
      rest = rest.slice(k);
      const s = row.reduce((a, b) => a + b.a, 0), thick = s / side;
      let off = 0;
      for (const r of row) {
        const len = r.a / thick;
        out.push(w >= h ? { it: r.it, x, y: y + off, w: thick, h: len } : { it: r.it, x: x + off, y, w: len, h: thick });
        off += len;
      }
      if (w >= h) { x += thick; w -= thick; } else { y += thick; h -= thick; }
    }
    return out;
  }
  const area = (x) => Math.max(useM ? x.m : x.v, 0);
  let cells = [];
  function draw() {
    el.byValue.setAttribute("aria-pressed", String(!useM)); el.byCap.setAttribute("aria-pressed", String(useM));
    const W = box.clientWidth, H = box.clientHeight;
    const secs = M.sectors.map((s) => ({ ...s, a: area(s) })).filter((s) => s.a > 0).sort((a, b) => b.a - a.a);
    cells = [];
    let html = "";
    for (const r of squarify(secs, 0, 0, W, H)) {
      const s = r.it, head = r.h > 44 && r.w > 46 ? 16 : 0;
      html += `<div class="sec" style="left:${r.x + 1}px;top:${r.y + 1}px;width:${Math.max(r.w - 2, 0)}px;height:${Math.max(r.h - 2, 0)}px">` +
        (head ? `<b>${esc(s.n)}<span class="${s.p > 0 ? "up" : s.p < 0 ? "down" : ""}">${pc(s.p)}</span></b>` : "") + "</div>";
      const kids = s.st.map((c) => ({ ...c, a: area(c), sec: s.n })).filter((c) => c.a > 0).sort((a, b) => b.a - a.a);
      for (const q of squarify(kids, r.x + 1, r.y + 1 + head, r.w - 2, r.h - 2 - head)) {
        const c = q.it, k = cells.push(c) - 1, w = q.w - 1, h = q.h - 1;
        const fs = Math.max(10, Math.min(22, Math.sqrt(w * h) / 6));
        const label = w > 40 && h > 26 ? `<span class="nm" style="font-size:${fs.toFixed(0)}px">${esc(c.n || c.s)}</span>` +
          (h > fs * 2.4 ? `<span class="pc" style="font-size:${Math.max(10, fs * 0.8).toFixed(0)}px">${pc(c.p)}</span>` : "") : "";
        html += `<div class="c" data-k="${k}" style="left:${q.x.toFixed(1)}px;top:${q.y.toFixed(1)}px;width:${Math.max(w, 0).toFixed(1)}px;` +
          `height:${Math.max(h, 0).toFixed(1)}px;background:${col(c.p)};color:${ink(c.p)}">${label}</div>`;
      }
    }
    box.innerHTML = html;
  }
  const tip = el.tip, wrap = box.parentElement;
  function showTip(e) {
    const t = e.target.closest ? e.target.closest(".c[data-k]") : null;
    if (!t) { tip.hidden = true; return; }
    const c = cells[+t.dataset.k], b = wrap.getBoundingClientRect();
    tip.innerHTML = `<b>${esc(c.n)}</b> <span class="muted num">${esc(c.s)}</span><br>${esc(c.sec)}　` +
      `<span class="num ${c.p > 0 ? "up" : c.p < 0 ? "down" : ""}">${pc(c.p)}</span>` +
      `<br>成交值 ${yi(c.v)}${c.m ? `　市值 ${yi(c.m)}` : ""}${c.c != null ? `<br>對大盤 <span class="num ${c.c > 0 ? "up" : "down"}">${pt(c.c)} 點</span>` : ""}`;
    tip.hidden = false;
    tip.style.left = Math.max(0, Math.min(e.clientX - b.left + 14, b.width - 180)) + "px";
    tip.style.top = (e.clientY - b.top + 14) + "px";
  }
  box.addEventListener("mousemove", showTip);
  box.addEventListener("click", showTip);            // phones: tap a cell to see its details
  box.addEventListener("mouseleave", () => { tip.hidden = true; });
  el.byValue.addEventListener("click", () => { useM = false; draw(); });
  el.byCap.addEventListener("click", () => { if (M.has_m) { useM = true; draw(); } });
  if (!M.has_m) { el.byCap.disabled = true; el.byCap.title = "需要發行股數資料（每週更新一次）"; }
  el.note.textContent = `${M.day || ""}${M.time ? " " + M.time : ""}　${M.stocks} 檔上市櫃股票　上漲 ${M.up_count}、下跌 ${M.down_count}` +
    (M.est_change != null && M.taiex_change != null ? `　貢獻估算合計 ${pt(M.est_change)} 點（實際 ${pt(M.taiex_change)} 點）` : "");
  const li = (x) => `<li><span class="sy">${esc(x.s)}</span><span class="nm" title="${esc(x.ind)}">${esc(x.n)}</span>` +
    `<span class="num ${x.p > 0 ? "up" : "down"}">${pc(x.p)}</span><span class="num ${x.c > 0 ? "up" : "down"}">${pt(x.c)}</span></li>`;
  el.side.innerHTML = M.top_up.length || M.top_down.length
    ? `<div><h3>撐盤前 ${M.top_up.length}（點）</h3><ol>${M.top_up.map(li).join("") || '<li class="empty">無</li>'}</ol></div>` +
      `<div><h3>拖盤前 ${M.top_down.length}（點）</h3><ol>${M.top_down.map(li).join("") || '<li class="empty">無</li>'}</ol></div>`
    : '<p class="empty">對大盤的貢獻點數需要發行股數資料，每週更新一次，下次排程後出現。</p>';
  draw();
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(draw, 120); });
  // a hidden view has zero width at first paint; draw again once it is shown
  if (el.hashView) addEventListener("hashchange", () => { if (location.hash === el.hashView) requestAnimationFrame(draw); });
  if (!box.clientWidth) requestAnimationFrame(draw);
}
</script>
